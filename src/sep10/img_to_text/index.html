<!DOCTYPE html>
<html>
<head>
    <title>Simple OCR App</title>
    <style>
        body {
            font-family: Arial;
            margin: 40px;
            background-color: purple;
            color: white;
            width : full ;
        }
        button {
            margin-top: 10px;
            padding: 8px;
        }
        #result {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Simple OCR App</h1>
    <hr>
    <input type="file" id="fileInput">
    <br>
    <button onclick="uploadFile()">Upload File</button>
    <button onclick="getDocuments()">See Extracted Text</button>
    <div id="message"></div>
    <div id="result"></div>
    
    
    //js
    <script>
        async function uploadFile() {
            const fileInput = document.getElementById("fileInput");
            if (!fileInput.files[0]) {
                alert("Please select a file  then click ");
                return;
            }
            const formData = new FormData();
            formData.append("file", fileInput.files[0]);
         document.getElementById("message").innerText = "Uploading waiit  have patience ";
            try {
                const response = await fetch("/upload", {
                    method: "POST",
                    body: formData
                });
                const data = await response.json();
                console.log("Uploaded  responses..., :", data);
                document.getElementById("message").innerText = data.message;
            } catch (error) {
                console.log("Upload error!!!!!!!!  :", error);
                document.getElementById("message").innerText = "Upload failed";
            }
        }

        async function getDocuments() {
        try {
                const response = await fetch("/documents");
                const documents = await response.json();
                console.log("Documents received 100% :", documents);
                const result = document.getElementById("result");
                result.innerHTML = "";
                if (documents.length === 0) {
                    result.innerHTML = "<p>No OCR documents found.</p>";
                    return;
                }
                documents.forEach(function(document) {
                    const div = document.createElement("div");
                    div.innerHTML = `<hr> <h3>${document.filename}</h3> 
                                           <p>${document.text}</p>
                                            <small>${document.createdAt}</small> `;
                    result.appendChild(div);
                });
            } catch (error) {
                console.log("Get documents error:", error);
            }
        }
    </script>
</body>
</html>
