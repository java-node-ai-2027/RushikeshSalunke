    <script>
    let lastUploadedId = null;   // ✅ remember which file we just uploaded

    async function uploadFile() {
        const fileInput = document.getElementById("fileInput");

        if (!fileInput.files[0]) {
            alert("Please select a file");
            return;
        }

        const formData = new FormData();
        formData.append("file", fileInput.files[0]);

        document.getElementById("message").innerText =
            "Uploading... please wait";

        try {
            const response = await fetch("/upload", {
                method: "POST",
                body: formData
            });

            const data = await response.json();
            console.log("Upload response:", data);

            document.getElementById("message").innerText = data.message;

            // ✅ store the id returned by the server
            lastUploadedId = data.id;

            // ✅ clear old results so the UI is not confusing
            document.getElementById("result").innerHTML = "";

        } catch (error) {
            console.log("Upload error:", error);
            document.getElementById("message").innerText = "Upload failed";
        }
    }

    async function getDocuments() {
        try {
            if (!lastUploadedId) {
                document.getElementById("result").innerText =
                    "Please upload a file first.";
                return;
            }

            // ✅ only ask for the last uploaded document
            const response = await fetch("/documents?id=" + lastUploadedId);
            const documents = await response.json();

            console.log("Documents:", documents);

            const result = document.getElementById("result");
            result.innerHTML = "";

            if (!Array.isArray(documents) || documents.length === 0) {
                result.innerHTML = "<p>No documents found.</p>";
                return;
            }

            documents.forEach(function (doc) {
                const div = document.createElement("div");

                const filename = doc.filename || doc.fileName || "Unknown file";

                div.innerHTML = `
                    <hr>
                    <h3>File: ${filename}</h3>
                    <p>${doc.text}</p>
                    <small>${doc.createdAt}</small>
                `;

                result.appendChild(div);
            });

        } catch (error) {
            console.log("Get documents error:", error);
            document.getElementById("result").innerText =
                "Could not get documents";
        }
    }
</script>
